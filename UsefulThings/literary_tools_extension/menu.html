<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Literary Tools</title>
  <link rel="stylesheet" href="styles.css">
  <script src="menu.js" defer></script>
</head>
<body>
  <h2>Literary Tools</h2>
  <h3>By Maikote</h3>
  <div id="literary_tool_container">
    <button id="note_btn" class="menu_btn">Note Taker</button>
    <div id="note_menu" hidden>
      <button id="new_note_btn" class="menu_btn">New</button>
      <button id="load_note_btn" class="menu_btn">Load</button>
    </div>
    <button id="exit_btn" class="menu_btn">Exit</button>

    <!-- New Note -->
    <div id="new_note" hidden>
      <input type="text" id="note_name" placeholder="Note Name" />
      <textarea id="noteInput" placeholder="Write your thoughts..."></textarea>
      <button id="save_note">Save</button>
      <button id="cancel_note">Cancel</button>
    </div>

    <!-- Load Notes -->
    <div id="load_menu" hidden>
      <p id="saved_notes_label">Saved Notes:</p>
      <div id="notes_list"></div>
      <button id="return_btn">Return</button>
    </div>
  </div>
</body>
</html>
